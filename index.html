<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나랑 딱 맞는 은퇴견 짝꿍 찾기</title>
  <style>
    /* 기본 리셋 및 전역 디자인 토큰 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #FDF9F3 0%, #F8EFE4 100%);
      color: #332B25;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(180, 130, 90, 0.12);
      border: 1px solid #EFE4D6;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 화면 전환용 공통 뷰 */
    .screen {
      display: none;
      padding: 32px 24px;
      animation: fadeIn 0.3s ease-out forwards;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 1. 시작 화면 */
    .start-hero {
      text-align: center;
      padding: 20px 0 16px;
    }

    .hero-badge {
      display: inline-block;
      background-color: #FFF2DF;
      color: #C06014;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid #FFE0B5;
    }

    .hero-emoji {
      font-size: 58px;
      line-height: 1.2;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 10px rgba(220, 140, 60, 0.2));
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: #2D241E;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .app-subtitle {
      font-size: 15px;
      color: #726357;
      line-height: 1.55;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .count-card {
      background: #FAF4EB;
      border: 2px dashed #E5D5C2;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .count-icon {
      font-size: 24px;
    }

    .count-text {
      font-size: 16px;
      font-weight: 700;
      color: #9E4F0A;
    }

    /* 공통 버튼 디자인 */
    .btn {
      width: 100%;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      padding: 18px 24px;
      border-radius: 24px;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #FF8A3D 0%, #FF6827 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(255, 108, 39, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #FF954F 0%, #FF7235 100%);
      box-shadow: 0 10px 24px rgba(255, 108, 39, 0.42);
    }

    /* 2. 질문 화면 */
    .quiz-header {
      margin-bottom: 24px;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background-color: #EFE4D6;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFB26B, #FF7B54);
      border-radius: 8px;
      transition: width 0.3s ease-out;
    }

    .quiz-step-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      color: #A08C7D;
    }

    .quiz-question-box {
      margin-bottom: 28px;
    }

    .quiz-num-badge {
      font-size: 13px;
      color: #E65C00;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .quiz-title {
      font-size: 22px;
      font-weight: 800;
      color: #2D241E;
      line-height: 1.4;
      word-break: keep-all;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: #FAF6F0;
      border: 2px solid #EFE4D6;
      border-radius: 20px;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #43372E;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover {
      background: #FFF3E6;
      border-color: #FFB380;
      transform: translateY(-2px);
    }

    .option-btn:active {
      transform: scale(0.98);
      background: #FFE8D1;
    }

    .option-arrow {
      color: #C2AB99;
      font-size: 18px;
      font-weight: 800;
    }

    .quiz-footer {
      display: flex;
      justify-content: flex-start;
      margin-top: 8px;
    }

    .btn-prev {
      background: transparent;
      border: 1px solid #D9C8B5;
      color: #796656;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-prev:hover {
      background: #F4EAE0;
    }

    /* 3. 결과 화면 */
    .result-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .result-badge {
      display: inline-block;
      background: #FFF1D6;
      color: #B56708;
      font-size: 13px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 16px;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 24px;
      font-weight: 800;
      color: #2D241E;
      margin-bottom: 6px;
    }

    .result-subtitle {
      font-size: 14px;
      color: #7A695C;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .dog-card {
      background: #FFFFFF;
      border: 2px solid #EFE4D6;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(160, 110, 70, 0.08);
      position: relative;
      overflow: hidden;
    }

    .rank-ribbon {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #FFF4E5;
      color: #C85900;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #FFD9B3;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dog-card.top1 {
      border: 2px solid #FF9E53;
      background: linear-gradient(180deg, #FFFDF8 0%, #FFFFFF 100%);
      box-shadow: 0 10px 26px rgba(255, 140, 50, 0.16);
    }

    .dog-card.top1 .rank-ribbon {
      background: linear-gradient(135deg, #FF8000, #FF5500);
      color: #FFFFFF;
      border: none;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .dog-avatar {
      font-size: 44px;
      width: 68px;
      height: 68px;
      background: #FAF2E8;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #EEDBCA;
    }

    .dog-primary-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dog-name-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .dog-name {
      font-size: 21px;
      font-weight: 800;
      color: #2D241E;
    }

    .dog-num {
      font-size: 12px;
      color: #9C8B7E;
      font-weight: 600;
    }

    .dog-sub-info {
      font-size: 13px;
      color: #6C5C50;
      font-weight: 600;
    }

    .dog-duty {
      font-size: 12px;
      color: #2B7A78;
      font-weight: 700;
      background: #E8F5F5;
      padding: 2px 8px;
      border-radius: 6px;
      align-self: flex-start;
      margin-top: 4px;
    }

    /* 매칭 점수 게이지 */
    .score-banner {
      background: #FDF6EE;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .score-label {
      font-size: 13px;
      font-weight: 700;
      color: #7E6B5D;
    }

    .score-value {
      font-size: 20px;
      font-weight: 900;
      color: #FF5A1F;
    }

    /* 태그 및 주의 문구 */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tag-chip {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .tag-energy {
      background: #FFEBE0;
      color: #D34500;
    }

    .tag-calm {
      background: #EAF3FF;
      color: #1F60C2;
    }

    .tag-affection {
      background: #FFEAF3;
      color: #B5226D;
    }

    .caution-box {
      width: 100%;
      background: #FFF8E6;
      border-left: 4px solid #FFAA00;
      color: #8C5900;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 12px;
    }

    /* 잘 맞는 이유 박스 */
    .reason-box {
      background: #F8F9FA;
      border: 1px solid #EAECEF;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .reason-heading {
      font-size: 12px;
      font-weight: 800;
      color: #2D6A4F;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reason-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .reason-item {
      font-size: 12.5px;
      color: #495057;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .reason-dot {
      color: #52B788;
      font-size: 14px;
      line-height: 1;
    }

    /* 소개글 섹션 */
    .intro-section {
      background: #FAF8F5;
      border-radius: 14px;
      padding: 12px 14px;
    }

    .intro-title {
      font-size: 11px;
      font-weight: 800;
      color: #938275;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .intro-text {
      font-size: 13px;
      color: #55483E;
      line-height: 1.55;
      word-break: keep-all;
    }

    .intro-empty {
      font-size: 13px;
      color: #A3968B;
      font-style: italic;
    }

    /* 결과 화면 하단 안내 */
    .disclaimer-card {
      background: #F7F5F0;
      border-radius: 16px;
      padding: 14px;
      font-size: 12px;
      color: #7A6F66;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 20px;
    }

    .btn-restart {
      background: #4A3E36;
      color: #FFFFFF;
      box-shadow: 0 6px 18px rgba(74, 62, 54, 0.25);
    }

    .btn-restart:hover {
      background: #392F28;
    }
  </style>
</head>
<body>

<div id="app-container">

  <!-- 1. 시작 화면 -->
  <section id="screen-start" class="screen active">
    <div class="start-hero">
      <div class="hero-badge">🐾 농림축산검역본부 은퇴 탐지견 매칭</div>
      <div class="hero-emoji">🐕‍🦺💕🐶</div>
      <h1 class="app-title">나랑 딱 맞는<br>은퇴견 짝꿍 찾기</h1>
      <p class="app-subtitle">
        국경을 지키며 묵묵히 헌신해 온 검역탐지견 친구들!<br>
        나의 라이프스타일과 가장 어울리는 평생 짝꿍을 찾아보세요.
      </p>
    </div>

    <div class="count-card">
      <span class="count-icon">🏡</span>
      <span class="count-text" id="waiting-count-display">기다리는 친구 84마리</span>
    </div>

    <button id="btn-start" class="btn btn-primary">
      테스트 시작하기 🐾
    </button>
  </section>

  <!-- 2. 질문 화면 -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-header">
      <div class="progress-bar-container">
        <div id="quiz-progress-fill" class="progress-bar-fill" style="width: 20%;"></div>
      </div>
      <div class="quiz-step-info">
        <span>짝꿍 탐색 질문</span>
        <span id="quiz-step-text">1 / 5</span>
      </div>
    </div>

    <div class="quiz-question-box">
      <div class="quiz-num-badge" id="quiz-badge">QUESTION 1</div>
      <h2 class="quiz-title" id="quiz-title-text">하루 산책은 얼마나 할 수 있어?</h2>
    </div>

    <div class="quiz-options" id="quiz-options-container">
      <!-- 동적 보기 버튼 생성 영역 -->
    </div>

    <div class="quiz-footer">
      <button id="btn-prev" class="btn-prev" style="display: none;">← 이전 질문</button>
    </div>
  </section>

  <!-- 3. 결과 화면 -->
  <section id="screen-result" class="screen">
    <div class="result-header">
      <div class="result-badge">✨ 매칭 분석 완료</div>
      <h2 class="result-title">나의 은퇴견 베스트 짝꿍</h2>
      <p class="result-subtitle">당신의 일상과 꼭 맞는 3마리의 친구들을 소개합니다</p>
    </div>

    <div class="cards-container" id="result-cards-container">
      <!-- 상위 3마리 결과 카드 생성 영역 -->
    </div>

    <div class="disclaimer-card">
      ℹ️ 이 결과는 재미로 보는 참고용이에요. 실제 입양은 기관의 심사를 거쳐요.
    </div>

    <button id="btn-restart" class="btn btn-restart">
      처음부터 다시 하기 🔄
    </button>
  </section>

</div>

<script>
/**
 * 농림축산검역본부 은퇴 탐지견 84마리 전체 데이터 (생략 없음)
 */
const DOGS = [
  { 번호: 1, 이름: "나래", 품종: "비글", 성별: "암컷(중성화)", 업무: "공항 수하물 검역탐지", 소개: "사람을 너무 좋아해서 보자마자 배를 발라당 뒤집고 애교를 부려요. 활발하고 호기심이 많아요." },
  { 번호: 2, 이름: "토리", 품종: "비글", 성별: "수컷(중성화)", 업무: "국제우편 검역탐지", 소개: "냄새 맡는 걸 좋아하고 쉴 새 없이 뛰어다니는 활발한 친구예요. 에너지 넘쳐요." },
  { 번호: 3, 이름: "보람", 품종: "래브라도 리트리버", 성별: "암컷(중성화)", 업무: "공항 수하물 검역탐지", 소개: "성격이 아주 온순하고 차분해요. 사람 품에 조용히 안기는 걸 즐깁니다." },
  { 번호: 4, 이름: "태양", 품종: "래브라도 리트리버", 성별: "수컷(중성화)", 업무: "항만 화물 검역탐지", 소개: "사람 손길에 애교가 넘치며 항상 순한 눈망울로 바라봐요. 산책도 얌전하게 잘해요." },
  { 번호: 5, 이름: "퓨리", 품종: "잉글리시 스프링어 스패니얼", 성별: "수컷(중성화)", 업무: "공항 수하물 검역탐지", 소개: "공놀이에 대한 에너지가 넘치고 잔디밭에서 신나게 뛰어노는 걸 가장 좋아해요." },
  { 번호: 6, 이름: "누리", 품종: "잉글리시 스프링어 스패니얼", 성별: "암컷(중성화)", 업무: "국제우편 검역탐지", 소개: "밝고 활발하며 호기심이 풍부해요. 사람에게 안기기를 좋아하는 애교쟁이입니다." },
  { 번호: 7, 이름: "델타", 품종: "비글", 성별: "수컷(중성화)", 업무: "공항 수하물 검역탐지", 소개: "순한 성격으로 친구들과 싸우지 않고 차분하게 옆을 지켜주는 듬직한 은퇴견이에요." },
  { 번호: 8, 이름: "볼트", 품종: "벨지안 말리노이즈", 성별: "수컷(중성화)", 업무: "항만 화물 검역탐지", 소개: "에너지가 폭발적이고 지치지 않고 뛰어다녀요. 활동적인 놀이를 좋아합니다." },
  { 번호: 9, 이름: "바람", 품종: "벨지안 말리노이즈", 성별: "암컷(중성화)", 업무: "검역 훈련견", 소개: "처음 보는 사람이나 낯선 환경에는 조금 소심하지만 적응하면 충성심이 대단해요." },
  { 번호: 10, 이름: "레오", 품종: "저먼 셰퍼드", 성별: "수컷(중성화)", 업무: "항만 화물 검역탐지", 소개: "차분하고 듬직하며 온순한 면모가 있어요. 낯을 조금 가리지만 정이 깊어요." },

/**
 * 품종별 기본 점수 반환 함수 [활동량, 초보친화, 동물친화]
 */
function getBreedBaseScores(breedName) {
  if (breedName.includes("래브라도")) {
    return { activity: 3, beginner: 5, animal: 4 };
  } else if (breedName.includes("비글")) {
    return { activity: 4, beginner: 4, animal: 5 };
  } else if (breedName.includes("말리노이즈")) {
    return { activity: 5, beginner: 1, animal: 3 };
  } else if (breedName.includes("셰퍼드") || breedName.includes("셔퍼드")) {
    return { activity: 4, beginner: 2, animal: 3 };
  } else if (breedName.includes("스프링어") || breedName.includes("스패니얼")) {
    return { activity: 5, beginner: 3, animal: 4 };
  } else {
    // 기타 견종 (포인터, 믹스견 등)
    return { activity: 2, beginner: 3, animal: 3 };
  }
}

/**
 * 견종에 어울리는 대표 이모지 반환
 */
function getBreedEmoji(breedName) {
  if (breedName.includes("비글")) return "🐶";
  if (breedName.includes("래브라도")) return "🦮";
  if (breedName.includes("말리노이즈")) return "🐕‍🦺";
  if (breedName.includes("셰퍼드")) return "🐕";
  if (breedName.includes("스프링어")) return "🐾";
  return "🐶";
}

/**
 * 소개글 기반 성향 수정, 태그 및 주의 문구 생성 함수
 */
function analyzeDogPersonality(dog) {
  const base = getBreedBaseScores(dog.품종);
  let activity = base.activity;
  const beginner = base.beginner;
  const animal = base.animal;

  const tags = [];
  let caution = null;
  const intro = dog.소개 || "";

  // 1. 활동량 증가 조건
  if (intro.includes("활발") || intro.includes("에너지") || intro.includes("뛰어")) {
    activity += 1;
    tags.push("🏃 에너지 뿜뿜");
  }

  // 2. 활동량 감소 조건
  if (intro.includes("차분") || intro.includes("조용") || intro.includes("온순") || intro.includes("순한")) {
    activity -= 1;
    tags.push("🛋️ 차분한 편");
  }

  // 활동량은 1~5 사이를 넘지 않게 조정
  activity = Math.max(1, Math.min(5, activity));

  // 3. 애교 태그 조건
  if (intro.includes("애교") || intro.includes("안기") || intro.includes("배를")) {
    tags.push("💕 애교쟁이");
  }

  // 4. 소심/적응 주의 문구 조건
  if (intro.includes("겁") || intro.includes("낯") || intro.includes("소심")) {
    caution = "💡 새 환경에 천천히 적응해요";
  }

  return {
    activity,
    beginner,
    animal,
    tags,
    caution
  };
}

/**
 * 단일 강아지와 사용자의 궁합 점수 계산 및 긍정 이유 추출
 */
function calculateCompatibility(dog, answers) {
  const q1Val = answers[0]; // 산책 값 (2, 3, 5)
  const q2Val = answers[1]; // 집 ("아파트·빌라", "마당 있는 주택")
  const q3Val = answers[2]; // 반려동물 ("있어", "없어")
  const q4Val = answers[3]; // 경험 값 (1, 3, 5)
  const q5Val = answers[4]; // 성격 ("애교쟁이", "차분한 친구", "놀이 친구")

  const analysis = analyzeDogPersonality(dog);
  let score = 100;
  const matchReasons = [];

  // 1. 산책 점수 계산 (|질문1 값 - 활동량| × 10점 차감)
  const walkDiff = Math.abs(q1Val - analysis.activity);
  score -= walkDiff * 10;
  if (walkDiff === 0) {
    matchReasons.push("하루 산책 시간과 강아지의 활동량이 딱 맞아 서로 부담이 없어요!");
  } else if (walkDiff === 1) {
    matchReasons.push("보호자님의 산책 스타일과 무난하게 보조를 맞출 수 있는 에너지를 지녔어요.");
  }

  // 2. 주거 환경 점수 계산
  if (q2Val === "아파트·빌라" && analysis.activity === 5) {
    score -= 10;
  } else if (q2Val === "마당 있는 주택" && analysis.activity >= 4) {
    score += 5;
    matchReasons.push("마당이 있는 주택이라 넘치는 활력을 자유롭게 발산하기에 최적의 환경이에요!");
  } else if (q2Val === "아파트·빌라" && analysis.activity <= 3) {
    matchReasons.push("차분한 활동량 덕분에 아파트나 실내에서도 평온하게 잘 적응할 수 있어요.");
  }

  // 3. 다른 반려동물 유무
  if (q3Val === "있어") {
    score -= (5 - analysis.animal) * 6;
    if (analysis.animal >= 4) {
      matchReasons.push("다른 동물과 두루두루 잘 어울리는 높은 사회성을 갖춘 친구예요.");
    }
  } else {
    // 1마리 집중 양육 환경
    matchReasons.push("보호자님의 사랑과 관심을 오롯이 받으며 단란하게 살기 좋아요.");
  }

  // 4. 반려 경험 점수 계산
  const requiredExp = 6 - analysis.beginner;
  if (q4Val < requiredExp) {
    score -= (requiredExp - q4Val) * 8;
  } else {
    if (analysis.beginner >= 4) {
      matchReasons.push("순하고 다루기 편해 초보 보호자도 편안하게 돌볼 수 있어요.");
    } else {
      matchReasons.push("보호자님의 든든한 반려 경험 덕분에 전문 훈련견 출신의 장점을 잘 살려줄 수 있어요.");
    }
  }

  // 5. 원하는 성격 일치 여부
  if (q5Val === "애교쟁이" && analysis.tags.includes("💕 애교쟁이")) {
    score += 10;
    matchReasons.push("보호자님이 바라시던 온몸으로 표현하는 특급 '애교쟁이'예요!");
  }
  if (q5Val === "차분한 친구" && analysis.tags.includes("🛋️ 차분한 편")) {
    score += 10;
    matchReasons.push("원하시던 의젓하고 조용하게 곁을 지켜주는 힐링 메이트예요.");
  }
  if (q5Val === "놀이 친구" && analysis.activity >= 4) {
    score += 10;
    matchReasons.push("지치지 않는 체력으로 함께 뛰어놀 수 있는 최고의 놀이 파트너예요!");
  }

  // 최종 점수 40 ~ 99 범위로 보정
  const finalScore = Math.max(40, Math.min(99, score));

  // 추천 이유가 너무 많으면 최대 2개만 깔끔하게 선정
  const selectedReasons = matchReasons.slice(0, 2);
  if (selectedReasons.length === 0) {
    selectedReasons.push("국가에 봉사했던 의젓한 탐지견 특유의 높은 친화력을 지니고 있어요.");
  }

  return {
    dog,
    score: finalScore,
    analysis,
    reasons: selectedReasons
  };
}

/**
 * 질문 화면 렌더링
 */
function renderQuestion() {
  const currentQ = QUESTIONS[currentQuestionIndex];
  
  // 진행 막대 업데이트
  const progressPercent = ((currentQuestionIndex + 1) / QUESTIONS.length) * 100;
  quizProgressFill.style.width = `${progressPercent}%`;
  quizStepText.textContent = `${currentQuestionIndex + 1} / ${QUESTIONS.length}`;
  quizBadge.textContent = `QUESTION 0${currentQuestionIndex + 1}`;
  quizTitleText.textContent = currentQ.title;

  // 이전 버튼 가시성 (첫 질문에서는 숨김)
  btnPrev.style.display = currentQuestionIndex > 0 ? "inline-block" : "none";

  // 옵션 버튼 렌더링
  quizOptionsContainer.innerHTML = "";
  currentQ.options.forEach(option => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `
      <span>${option.label}</span>
      <span class="option-arrow">›</span>
    `;

    btn.addEventListener("click", () => {
      userAnswers[currentQuestionIndex] = option.value;
      if (currentQuestionIndex < QUESTIONS.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    });

    quizOptionsContainer.appendChild(btn);
  });
}

/**
 * 결과 화면 렌더링
 */
function showResults() {
  // 84마리 강아지에 대해 점수 계산 후 높은 순으로 정렬
  const scoredDogs = DOGS.map(dog => calculateCompatibility(dog, userAnswers));
  scoredDogs.sort((a, b) => b.score - a.score || a.dog.번호 - b.dog.번호);

  // 상위 3마리 추출
  const top3 = scoredDogs.slice(0, 3);

  resultCardsContainer.innerHTML = "";

  top3.forEach((item, index) => {
    const dog = item.dog;
    const analysis = item.analysis;
    const emoji = getBreedEmoji(dog.품종);
    const rankLabel = index === 0 ? "🥇 베스트 짝꿍 1위" : index === 1 ? "🥈 2위 짝꿍" : "🥉 3위 짝꿍";
    const topClass = index === 0 ? "top1" : "";

    // 태그 HTML 구성
    let tagsHtml = "";
    analysis.tags.forEach(tag => {
      let tagClass = "tag-energy";
      if (tag.includes("차분")) tagClass = "tag-calm";
      if (tag.includes("애교")) tagClass = "tag-affection";
      tagsHtml += `<span class="tag-chip ${tagClass}">${tag}</span>`;
    });

    // 주의 문구 HTML 구성
    const cautionHtml = analysis.caution
      ? `<div class="caution-box">${analysis.caution}</div>`
      : "";

    // 잘 맞는 이유 HTML 구성
    const reasonsHtml = item.reasons
      .map(r => `<li class="reason-item"><span class="reason-dot">✔</span><span>${r}</span></li>`)
      .join("");

    // 소개글 (비어 있는 경우 대체 문구)
    const introContent = dog.소개 && dog.소개.trim() !== ""
      ? `<p class="intro-text">${dog.소개}</p>`
      : `<p class="intro-empty">아직 소개글이 없어요 ✍️</p>`;

    const card = document.createElement("div");
    card.className = `dog-card ${topClass}`;
    card.innerHTML = `
      <div class="rank-ribbon">${rankLabel}</div>

      <div class="card-top">
        <div class="dog-avatar">${emoji}</div>
        <div class="dog-primary-info">
          <div class="dog-name-row">
            <span class="dog-name">${dog.이름}</span>
            <span class="dog-num">#${dog.번호}</span>
          </div>
          <span class="dog-sub-info">${dog.품종} · ${dog.성별}</span>
          <span class="dog-duty">${dog.업무}</span>
        </div>
      </div>

      <div class="score-banner">
        <span class="score-label">나와의 궁합 지수</span>
        <span class="score-value">${item.score}%</span>
      </div>

      ${cautionHtml}

      <div class="card-tags">
        ${tagsHtml}
      </div>

      <div class="reason-box">
        <div class="reason-heading">🌿 이래서 잘 맞아요</div>
        <ul class="reason-list">
          ${reasonsHtml}
        </ul>
      </div>

      <div class="intro-section">
        <div class="intro-title">소개</div>
        ${introContent}
      </div>
    `;

    resultCardsContainer.appendChild(card);
  });

  showScreen(screenResult);
}

/**
 * 이벤트 리스너 등록
 */
btnStart.addEventListener("click", () => {
  currentQuestionIndex = 0;
  userAnswers.length = 0;
  showScreen(screenQuiz);
  renderQuestion();
});

btnPrev.addEventListener("click", () => {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuestion();
  }
});

btnRestart.addEventListener("click", () => {
  currentQuestionIndex = 0;
  userAnswers.length = 0;
  showScreen(screenStart);
});
</script>
