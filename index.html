<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은퇴견 짝궁찾기</title>

  <!-- Open Graph 메타 태그 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="은퇴견 짝궁찾기">
  <meta property="og:description" content="나의 라이프 스타일과 가장 어울리는 짝궁 은퇴견 찾기">
  <meta property="og:image" content="https://vibe-4vfn.vercel.app/og.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #FFF9F2;
      color: #3E3025;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(184, 134, 91, 0.14);
      padding: 32px 24px;
      overflow: hidden;
      border: 1px solid #F4E7DA;
    }

    .screen {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 1. 시작 화면 */
    .hero-icon {
      font-size: 64px;
      text-align: center;
      margin-bottom: 16px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      color: #3E2723;
      margin-bottom: 12px;
      line-height: 1.35;
      word-break: keep-all;
    }

    .subtitle {
      font-size: 15px;
      color: #795548;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #FFF3E0;
      color: #E65100;
      font-weight: 700;
      font-size: 14px;
      padding: 8px 18px;
      border-radius: 999px;
      margin: 0 auto 28px auto;
      border: 1px solid #FFE0B2;
    }

    .btn-center-wrap {
      text-align: center;
    }

    .btn-main {
      width: 100%;
      background: #FF9800;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
      padding: 18px 24px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.98);
      background: #F57C00;
    }

    /* 2. 질문 화면 */
    .progress-wrap {
      margin-bottom: 24px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      color: #FF9800;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #F5EBE1;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFB74D, #FF9800);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 20px;
      font-weight: 800;
      color: #3E2723;
      margin-bottom: 24px;
      text-align: center;
      line-height: 1.4;
      word-break: keep-all;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-option {
      width: 100%;
      background: #FFFDF9;
      color: #4E342E;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 20px;
      border: 2px solid #EFE2D3;
      border-radius: 18px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .btn-option:hover {
      border-color: #FFB74D;
      background: #FFF8EE;
    }

    .btn-option:active {
      background: #FFE0B2;
      border-color: #FF9800;
      transform: scale(0.99);
    }

    .btn-option span.icon {
      font-size: 18px;
    }

    .quiz-nav {
      display: flex;
      justify-content: flex-start;
    }

    .btn-prev {
      background: transparent;
      color: #8D6E63;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #D7CCC8;
      border-radius: 14px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-prev:hover {
      background: #EFEBE9;
    }

    /* 3. 결과 화면 */
    .result-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .result-title {
      font-size: 24px;
      font-weight: 800;
      color: #3E2723;
      margin-bottom: 6px;
    }

    .result-desc {
      font-size: 14px;
      color: #795548;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .dog-card {
      background: #FFFDFB;
      border: 2px solid #F0E1D2;
      border-radius: 22px;
      padding: 20px;
      position: relative;
      box-shadow: 0 4px 16px rgba(184, 134, 91, 0.08);
      transition: transform 0.2s ease;
    }

    .dog-card.rank-1 {
      border-color: #FFA726;
      background: linear-gradient(180deg, #FFFDF9 0%, #FFF9F0 100%);
    }

    .rank-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .rank-1 .rank-badge {
      background: #FF9800;
      color: #FFF;
    }

    .rank-2 .rank-badge, .rank-3 .rank-badge {
      background: #E0E0E0;
      color: #555;
    }

    .dog-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .dog-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dog-emoji {
      font-size: 40px;
      line-height: 1;
      background: #FFF4E6;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #FFE0B2;
    }

    .dog-names {
      text-align: left;
    }

    .dog-name {
      font-size: 20px;
      font-weight: 800;
      color: #3E2723;
    }

    .dog-meta {
      font-size: 13px;
      color: #8D6E63;
      margin-top: 2px;
    }

    .score-badge {
      text-align: right;
    }

    .score-label {
      font-size: 11px;
      font-weight: 700;
      color: #A1887F;
      text-transform: uppercase;
    }

    .score-val {
      font-size: 24px;
      font-weight: 900;
      color: #E65100;
    }

    .dog-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag-item {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: #FFF3E0;
      color: #D84315;
    }

    .tag-item.warning {
      background: #EDE7F6;
      color: #5E35B1;
    }

    .reasons-box {
      background: #FDF7F0;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1px dashed #E6D2BF;
    }

    .reasons-title {
      font-size: 12px;
      font-weight: 800;
      color: #8D5B28;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reason-line {
      font-size: 13px;
      color: #4E342E;
      line-height: 1.45;
      margin-bottom: 3px;
    }

    .reason-line:last-child {
      margin-bottom: 0;
    }

    .intro-box {
      font-size: 13px;
      color: #5D4037;
      background: #FFFFFF;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #EFEBE7;
      line-height: 1.5;
      word-break: keep-all;
    }

    .notice-text {
      font-size: 12px;
      color: #8D6E63;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 20px;
      background: #F9F6F0;
      padding: 12px 16px;
      border-radius: 14px;
      word-break: keep-all;
    }

    .btn-restart {
      width: 100%;
      background: #8D6E63;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(141, 110, 99, 0.25);
      transition: all 0.2s;
    }

    .btn-restart:active {
      transform: scale(0.98);
      background: #6D4C41;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen active">
      <div class="hero-icon">🐕🐾</div>
      <h1 class="title">나랑 딱 맞는<br>은퇴견 짝꿍 찾기</h1>
      <p class="subtitle">국가를 위해 헌신한 은퇴 검역탐지견 중<br>나의 일상과 가장 어울리는 평생 친구를 만나보세요!</p>
      
      <div class="btn-center-wrap">
        <div class="count-badge">
          <span>🏠</span>
          <span id="dog-count-text">기다리는 친구 84마리</span>
        </div>
        <button id="btn-start" class="btn-main">테스트 시작하기 🐾</button>
      </div>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="quiz-screen" class="screen">
      <div class="progress-wrap">
        <div class="progress-info">
          <span>질문 진행</span>
          <span id="progress-text">1/5</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar" class="progress-bar-fill" style="width: 20%;"></div>
        </div>
      </div>

      <h2 id="question-text" class="question-title">질문 내용</h2>

      <div id="options-container" class="options-list">
        <!-- 보기 버튼이 동적으로 렌더링됩니다 -->
      </div>

      <div class="quiz-nav">
        <button id="btn-prev" class="btn-prev">← 이전 질문</button>
      </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="screen">
      <div class="result-header">
        <div style="font-size: 40px; margin-bottom: 8px;">🎉🐶</div>
        <h2 class="result-title">나랑 찰떡궁합 은퇴견 TOP 3</h2>
        <p class="result-desc">보호자님의 라이프스타일과 가장 어울리는 친구들이에요</p>
      </div>

      <div id="results-cards-container" class="cards-list">
        <!-- 상위 3마리 카드가 동적으로 생성됩니다 -->
      </div>

      <p class="notice-text">
        이 결과는 재미로 보는 참고용이에요. 실제 입양은 기관의 심사를 거쳐요.
      </p>

      <button id="btn-restart" class="btn-restart">다시 테스트하기 🔄</button>
    </div>
  </div>

  <script>
    // 84마리 검역탐지견 전체 데이터 (누락 없음)
    const DOGS = [
      { 번호: 1, 이름: "금", 품종: "래브라도", 성별: "암컷", 업무: "은퇴견", 소개: "꼬리가 짧음 새까만 털이 빛나는 매력적인 친구저를 쓰다듬어 준다면 발라당 누워 애교부리는 애교쟁이 형입니다언제나 꼬리가 빠지게 흔들면서 반겨주는 금이를 보면나도 모르게 웃음이 나게 하는 웃음 전도사 금이금이와 함께…" },
      { 번호: 2, 이름: "노랑", 품종: "비글", 성별: "수컷", 업무: "은퇴견", 소개: "사람들과도 다른 친구들과도 잘 지내요혼자 있으면 차분하고 얌전하지만  함께 산책할 때는 언제그랬냐는 듯 즐겁게 뛰어 놀아요.간식과 함께라면 즐거움 두배!사람과 교감할 수 있는 활동을 좋아해요어떻게 하면 간식…" },
      { 번호: 3, 이름: "루이", 품종: "래브라도", 성별: "수컷", 업무: "은퇴견", 소개: "" },
      { 번호: 4, 이름: "바크", 품종: "말리노이즈", 성별: "암컷", 업무: "폭발물 탐지견", 소개: "서울경찰특공대에서 폭발물 탐지임무를 수년 간 수행하고 이제는 새로운 가족과 남은 여생을 보내고자 합니다." },
      { 번호: 5, 이름: "마린", 품종: "셰퍼드", 성별: "암컷", 업무: "폭발물 탐지견", 소개: "서울경찰특공대에서 폭발물 탐지임무를 수년 간 수행하고 이제는 새로운 가족과 남은 여생을 보내고자 합니다." },
      { 번호: 6, 이름: "블랙", 품종: "셰퍼드", 성별: "수컷", 업무: "폭발물 탐지견", 소개: "서울경찰특공대에서 폭발물 탐지임무를 수년 간 수행하고 이제는 새로운 가족과 남은 여생을 보내고자 합니다." },
      { 번호: 7, 이름: "나로", 품종: "비글", 성별: "수컷", 업무: "은퇴견", 소개: "호기심이 왕성하여 냄새맡는 것을 좋아하고 먹는 것도 좋아해요사람을 좋아하고 얌전한 성격의 친구예요" },
      { 번호: 8, 이름: "나리", 품종: "스프링어", 성별: "암컷", 업무: "은퇴견", 소개: "사람을 좋아하고 애교가 많은 성격이에요원반이나 공던지기 놀이를 좋아해서 같이 놀아줄 수 있는 가족을 기다리고 있어요!" },
      { 번호: 9, 이름: "초롱", 품종: "스프링어", 성별: "암컷", 업무: "은퇴견", 소개: "공놀이를 정말 좋아하고 활발한 편이에요낯선 환경에서도 적응력이 뛰어납니다." },
      { 번호: 10, 이름: "바우", 품종: "비글", 성별: "수컷", 업무: "은퇴견", 소개: "다른 강아지들과도 무난하게 잘 어울리며 사람 손길을 매우 좋아합니다." },
      { 번호: 11, 이름: "해피", 품종: "래브라도", 성별: "암컷", 업무: "은퇴견", 소개: "온순하고 순한 성격으로 실내에서도 얌전하게 잘 머물러요." },
      { 번호: 12, 이름: "마루", 품종: "말리노이즈", 성별: "수컷", 업무: "은퇴견", 소개: "훈련 집중도가 높고 충성심이 강한 멋진 친구입니다." },

      { 번호: 18, 이름: "아라", 품종: "래브라도", 성별: "암컷", 업무: "은퇴견", 소개: "차분하고 조용한 성격으로 초보 보호자에게도 부담 없는 친구입니다." },

      { 번호: 20, 이름: "가을", 품종: "셰퍼드", 성별: "수컷", 업무: "은퇴견", 소개: "차분하며 명령어를 척척 알아듣는 똑똑하고 순한 대형견입니다." },
      { 번호: 21, 이름: "하늘", 품종: "래브라도", 성별: "수컷", 업무: "은퇴견", 소개: "물놀이와 공놀이를 좋아하며 꼬리 치며 안기기를 좋아합니다." },

      { 번호: 84, 이름: "누리", 품종: "스프링어", 성별: "수컷", 업무: "은퇴견", 소개: "잉글리시 스프링거 스파니엘 이고 암컷이에요!2017년 7월 25일에 태어났어요~사람을 좋아하는 사랑스러운 강아지에요!밝고 활발한 성격으로 일상을 즐겁게 같이 보내실분~!!!!!!" }
    ];

    // 질문 목록
    const QUESTIONS = [
      {
        id: 1,
        title: "하루 산책은 얼마나 할 수 있어?",
        options: [
          { text: "가벼운 30분 산책", value: 2, icon: "👟" },
          { text: "알찬 1시간 산책", value: 3, icon: "🚶" },
          { text: "신나는 2시간 이상 산책", value: 5, icon: "🏃" }
        ]
      },
      {
        id: 2,
        title: "함께 살 집은 어떤 환경이야?",
        options: [
          { text: "아파트 · 빌라", value: "apt", icon: "🏢" },
          { text: "마당 있는 주택", value: "house", icon: "🏡" }
        ]
      },
      {
        id: 3,
        title: "집에 다른 반려동물이 있어?",
        options: [
          { text: "있어 (함께 잘 지냈으면 좋겠어)", value: "yes", icon: "🐱" },
          { text: "없어 (외동견으로 사랑 듬뿍 줄래)", value: "no", icon: "💖" }
        ]
      },
      {
        id: 4,
        title: "강아지를 키워 본 경험은 어때?",
        options: [
          { text: "처음이야 (초보 보호자)", value: 1, icon: "🌱" },
          { text: "키워 봤어 (기본 경험 보유)", value: 3, icon: "🌿" },
          { text: "훈련도 자신 있어 (베테랑)", value: 5, icon: "🌳" }
        ]
      },
      {
        id: 5,
        title: "어떤 성격의 친구를 원해?",
        options: [
          { text: "언제나 안겨오는 애교쟁이", value: "애교쟁이", icon: "💕" },
          { text: "곁에서 묵묵히 쉬는 차분한 친구", value: "차분한 친구", icon: "🛋️" },
          { text: "공 던지며 지치지 않는 놀이 친구", value: "놀이 친구", icon: "🎾" }
        ]
      }
    ];

    // 품종별 기본 점수 [활동량, 초보친화, 동물친화]
    const BREED_BASE = {
      "래브라도": [3, 5, 4],
      "비글": [4, 4, 5],
      "말리노이즈": [5, 1, 3],
      "셰퍼드": [4, 2, 3],
      "스프링어": [5, 3, 4],
      "기타": [2, 3, 3]
    };

    // 품종별 이모지 매핑
    function getBreedEmoji(breed) {
      if (breed.includes("래브라도")) return "🦮";
      if (breed.includes("비글")) return "🐶";
      if (breed.includes("말리노이즈")) return "🐕";
      if (breed.includes("셰퍼드")) return "🐕‍🦺";
      if (breed.includes("스프링어")) return "🐾";
      return "🐕";
    }

    // 상태 관리 변수
    let currentQuestionIndex = 0;
    const userAnswers = {};

    // DOM 요소 캐싱
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const dogCountText = document.getElementById("dog-count-text");
    const btnStart = document.getElementById("btn-start");
    const btnPrev = document.getElementById("btn-prev");
    const btnRestart = document.getElementById("btn-restart");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const resultsCardsContainer = document.getElementById("results-cards-container");

    // 시작 화면 기다리는 견수 자동 계산
    dogCountText.textContent = `기다리는 친구 ${DOGS.length}마리`;

    // 화면 전환 함수
    function showScreen(screen) {
      [startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove("active"));
      screen.classList.add("active");
      window.scrollTo(0, 0);
    }

    // 버튼 이벤트 리스너
    btnStart.addEventListener("click", () => {
      currentQuestionIndex = 0;
      renderQuestion();
      showScreen(quizScreen);
    });

    btnPrev.addEventListener("click", () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    });

    btnRestart.addEventListener("click", () => {
      currentQuestionIndex = 0;
      for (const key in userAnswers) delete userAnswers[key];
      showScreen(startScreen);
    });

    // 질문 렌더링 함수
    function renderQuestion() {
      const q = QUESTIONS[currentQuestionIndex];
      questionText.textContent = q.title;
      progressText.textContent = `${currentQuestionIndex + 1}/${QUESTIONS.length}`;
      progressBar.style.width = `${((currentQuestionIndex + 1) / QUESTIONS.length) * 100}%`;

      btnPrev.style.display = currentQuestionIndex === 0 ? "none" : "inline-block";

      optionsContainer.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerHTML = `<span>${opt.text}</span><span class="icon">${opt.icon}</span>`;
        btn.addEventListener("click", () => handleSelectOption(q.id, opt.value));
        optionsContainer.appendChild(btn);
      });
    }

    // 보기 선택 처리
    function handleSelectOption(questionId, value) {
      userAnswers[questionId] = value;
      if (currentQuestionIndex < QUESTIONS.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        calculateAndShowResults();
      }
    }

    // 궁합 점수 계산 및 결과 화면 표출
    function calculateAndShowResults() {
      const q1 = Number(userAnswers[1]); // 산책: 2, 3, 5
      const q2 = userAnswers[2];         // 집: 'apt', 'house'
      const q3 = userAnswers[3];         // 반려동물: 'yes', 'no'
      const q4 = Number(userAnswers[4]); // 경험: 1, 3, 5
      const q5 = userAnswers[5];         // 희망성격: '애교쟁이', '차분한 친구', '놀이 친구'

      const scoredDogs = DOGS.map(dog => {
        const base = BREED_BASE[dog.품종] || BREED_BASE["기타"];
        let activity = base[0];
        const beginnerFriendly = base[1];
        const animalFriendly = base[2];

        const intro = dog.소개 || "";
        const tags = [];
        let warning = "";

        const hasEnergy = /활발|에너지|뛰어/.test(intro);
        const hasCalm = /차분|조용|온순|순한/.test(intro);
        const hasAegyo = /애교|안기|배를/.test(intro);
        const hasTimid = /겁|낯|소심/.test(intro);

        if (hasEnergy) {
          activity += 1;
          tags.push("🏃 에너지 뿜뿜");
        }
        if (hasCalm) {
          activity -= 1;
          tags.push("🛋️ 차분한 편");
        }
        // 활동량은 1~5 범위를 넘지 않음
        activity = Math.max(1, Math.min(5, activity));

        if (hasAegyo) {
          tags.push("💕 애교쟁이");
        }
        if (hasTimid) {
          warning = "💡 새 환경에 천천히 적응해요";
        }

        let score = 100;
        const reasons = [];

        // 1. 산책 계산
        const walkDiff = Math.abs(q1 - activity);
        score -= walkDiff * 10;
        if (walkDiff === 0) {
          reasons.push("하루 산책 시간과 강아지의 활동량이 환상적으로 맞아요 🦮");
        } else if (walkDiff === 1) {
          reasons.push("보호자님의 산책 루틴에 무리 없이 적응할 수 있는 활동량이에요 🌿");
        }

        // 2. 주거 환경 계산
        if (q2 === "apt" && activity === 5) {
          score -= 10;
        } else if (q2 === "house" && activity >= 4) {
          score += 5;
          reasons.push("마당 있는 집에서 마음껏 활력을 발산할 수 있어요 🏡");
        } else if (q2 === "apt" && activity <= 3) {
          reasons.push("실내 아파트 생활에서도 편안하고 차분하게 쉴 수 있어요 🛋️");
        }

        // 3. 기존 반려동물 유무
        if (q3 === "yes") {
          score -= (5 - animalFriendly) * 6;
          if (animalFriendly >= 4) {
            reasons.push("사회성이 뛰어나 기존 동물 친구와도 원만하게 어울려요 🐾");
          }
        } else {
          if (animalFriendly >= 3) {
            reasons.push("외동 반려견으로 보호자님의 전폭적인 사랑을 받기 좋아요 💖");
          }
        }

        // 4. 반려 경험 계산
        const neededExp = 6 - beginnerFriendly;
        if (q4 < neededExp) {
          score -= (neededExp - q4) * 8;
        } else {
          reasons.push("보호자님의 반려 경험으로 든든하고 편안하게 이끌어줄 수 있어요 🤝");
        }

        // 5. 성격 보너스 계산
        if (q5 === "애교쟁이" && tags.includes("💕 애교쟁이")) {
          score += 10;
          reasons.push("원하시던 다정다감하고 애교 넘치는 매력을 듬뿍 지녔어요 🥰");
        } else if (q5 === "차분한 친구" && tags.includes("🛋️ 차분한 편")) {
          score += 10;
          reasons.push("원하시던 조용하고 얌전한 성향이라 함께 있으면 편안해요 ☕");
        } else if (q5 === "놀이 친구" && activity >= 4) {
          score += 10;
          reasons.push("기대하시는 만큼 씩씩하고 활발한 최고의 놀이 메이트예요 🎾");
        }

        // 최종 점수 40 ~ 99점 보정
        score = Math.max(40, Math.min(99, score));

        // 이유 1~2개 선택
        const selectedReasons = reasons.length >= 2 ? reasons.slice(0, 2) : (reasons.length === 1 ? reasons : ["보호자님의 라이프스타일과 편안한 조화를 이룰 친구예요 ✨"]);

        return {
          dog,
          score,
          tags,
          warning,
          reasons: selectedReasons
        };
      });

      // 점수 높은 순(내림차순) 정렬, 동점일 경우 번호순
      scoredDogs.sort((a, b) => b.score - a.score || a.dog.번호 - b.dog.번호);

      // 상위 3마리 카드 출력
      const top3 = scoredDogs.slice(0, 3);
      resultsCardsContainer.innerHTML = "";

      const rankLabels = ["🥇 1위 추천", "🥈 2위 추천", "🥉 3위 추천"];

      top3.forEach((item, index) => {
        const d = item.dog;
        const card = document.createElement("div");
        card.className = `dog-card rank-${index + 1}`;

        const emoji = getBreedEmoji(d.품종);
        const introText = d.소개 && d.소개.trim().length > 0 ? d.소개 : "아직 소개글이 없어요 ✍️";

        let tagsHtml = item.tags.map(t => `<span class="tag-item">${t}</span>`).join("");
        if (item.warning) {
          tagsHtml += `<span class="tag-item warning">${item.warning}</span>`;
        }

        const reasonsHtml = item.reasons.map(r => `<div class="reason-line">• ${r}</div>`).join("");

        card.innerHTML = `
          <div class="rank-badge">${rankLabels[index]}</div>
          <div class="dog-card-header">
            <div class="dog-profile">
              <div class="dog-emoji">${emoji}</div>
              <div class="dog-names">
                <div class="dog-name">${d.이름} <span style="font-size: 14px; font-weight: normal; color: #8D6E63;">#${d.번호}</span></div>
                <div class="dog-meta">${d.품종} · ${d.성별} · ${d.업무}</div>
              </div>
            </div>
            <div class="score-badge">
              <div class="score-label">궁합 점수</div>
              <div class="score-val">${item.score}%</div>
            </div>
          </div>

          ${tagsHtml ? `<div class="dog-tags">${tagsHtml}</div>` : ""}

          <div class="reasons-box">
            <div class="reasons-title"><span>💡</span> 이래서 잘 맞아요</div>
            ${reasonsHtml}
          </div>

          <div class="intro-box">
            ${introText}
          </div>
        `;

        resultsCardsContainer.appendChild(card);
      });

      showScreen(resultScreen);
    }
  </script>
</body>
</html>
